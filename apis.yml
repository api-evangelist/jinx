name: Jinx
description: >-
  Jinx is a direct-to-consumer pet nutrition brand selling premium dog and cat
  food, toppers, and treats at thinkjinx.com. Its product lines span dry kibble,
  wet food (pate, stews, homestyle), fresh refrigerated meals, jerky and training
  treats, and meal toppers, formulated with high-quality proteins, probiotics, and
  superfoods. Backed by Initialized Capital, Jinx sells online and through retail
  partners. The storefront runs on Shopify; it exposes no first-party public
  developer API, but the store's Shopify Customer Account API OIDC/OAuth discovery
  is served live from the domain and is captured in this profile.
